# Production compose for the internal-network deployment.
# - No local Postgres: uses the external DB via DATABASE_URL in .env (e.g. AWS RDS).
# - Ports bound to 127.0.0.1 only; a reverse proxy terminates TLS on 443 and
#   forwards to the frontend (3000). The frontend rewrites /api/* to the backend.
# - Both services restart automatically.
#
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
# (the backend runs `alembic upgrade head` on start)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # internal only

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Server-side rewrite target (frontend container → backend container).
        BACKEND_URL: http://backend:8000
        # Public URL of the app; baked into client JS at build time.
        NEXT_PUBLIC_API_URL: ${FRONTEND_BASE_URL}
    environment:
      NODE_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # internal only; reverse proxy fronts this on 443
    depends_on:
      - backend
